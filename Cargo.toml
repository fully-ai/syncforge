[package]
name = "syncforge"
version = "0.1.0"
edition = "2021"
description = "Encrypted, chunked, deduplicated backup, snapshot, and synchronization CLI and daemon with local and S3-compatible storage."
license = "Apache-2.0"

[dependencies]
aes-gcm = "0.10"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
globset = "0.4"
hex = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = "3.5"
walkdir = "2.5"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.15"
